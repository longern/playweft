<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>屏幕旋转测试</title>
    <style>
      :root {
        color: #202124;
        background: #f7f8fa;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        width: min(720px, 100%);
        min-height: 100dvh;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 500;
      }

      p {
        margin: 0 0 20px;
        color: #5f6770;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 16px;
      }

      button {
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid #d8dde2;
        border-radius: 9px;
        background: #fff;
        color: #2c3136;
        font: inherit;
        font-size: 0.86rem;
      }

      button:active { background: #eef1f3; }

      section {
        margin-top: 16px;
        overflow: hidden;
        border: 1px solid #e0e4e7;
        border-radius: 12px;
        background: #fff;
      }

      h2 {
        margin: 0;
        padding: 12px 14px;
        border-bottom: 1px solid #edf0f2;
        font-size: 0.9rem;
        font-weight: 500;
      }

      pre {
        min-height: 120px;
        margin: 0;
        padding: 12px 14px;
        overflow: auto;
        color: #3f4851;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #orientation-indicator {
        padding: 14px;
        background: #eff6ef;
        color: #38663c;
        font-size: 0.9rem;
      }

      @media (orientation: landscape) {
        #orientation-indicator {
          background: #edf4fb;
          color: #38628b;
        }
      }
    </style>
  </head>
  <body>
    <h1>屏幕旋转测试</h1>
    <p>
      先直接横竖拿手机，观察“当前状态”和事件日志；再分别测试直接锁横屏与全屏后锁横屏。
    </p>

    <div class="controls">
      <button id="refresh-status" type="button">刷新状态</button>
      <button id="lock-landscape" type="button">锁定横屏</button>
      <button id="fullscreen-lock" type="button">全屏后锁横屏</button>
      <button id="unlock" type="button">解除屏幕锁定</button>
      <button id="exit-fullscreen" type="button">退出全屏</button>
      <button id="clear-log" type="button">清空日志</button>
    </div>

    <section>
      <h2>方向媒体查询</h2>
      <div id="orientation-indicator"></div>
    </section>

    <section>
      <h2>当前状态</h2>
      <pre id="status"></pre>
    </section>

    <section>
      <h2>事件与调用日志</h2>
      <pre id="log" aria-live="polite"></pre>
    </section>

    <script>
      const status = document.querySelector("#status");
      const log = document.querySelector("#log");
      const indicator = document.querySelector("#orientation-indicator");
      const startedAt = performance.now();

      function state() {
        const orientation = screen.orientation;
        const visualViewport = window.visualViewport;
        return {
          viewport: `${window.innerWidth} × ${window.innerHeight}`,
          visualViewport: visualViewport
            ? `${Math.round(visualViewport.width)} × ${Math.round(visualViewport.height)}`
            : "unavailable",
          mediaLandscape: window.matchMedia("(orientation: landscape)").matches,
          screenOrientationType: orientation?.type ?? "unavailable",
          screenOrientationAngle: orientation?.angle ?? "unavailable",
          screenOrientationLock: typeof orientation?.lock,
          fullscreenElement: document.fullscreenElement?.tagName ?? "none",
          deviceOrientationEvent: typeof window.DeviceOrientationEvent,
          userAgent: navigator.userAgent,
        };
      }

      function renderState() {
        const current = state();
        status.textContent = JSON.stringify(current, null, 2);
        indicator.textContent = current.mediaLandscape
          ? "当前媒体查询：横屏"
          : "当前媒体查询：竖屏";
      }

      function write(label, detail) {
        const elapsed = Math.round(performance.now() - startedAt);
        const text = detail === undefined ? "" : `\n${JSON.stringify(detail, null, 2)}`;
        log.textContent += `+${elapsed}ms ${label}${text}\n\n`;
        log.scrollTop = log.scrollHeight;
        renderState();
      }

      async function attempt(label, action) {
        write(`--- ${label} ---`, state());
        try {
          await action();
          write(`${label}: resolved`, state());
        } catch (error) {
          write(`${label}: rejected`, {
            name: error?.name ?? "Error",
            message: error?.message ?? String(error),
            state: state(),
          });
        }
      }

      document.querySelector("#refresh-status").addEventListener("click", () => {
        write("manual status refresh", state());
      });

      document.querySelector("#lock-landscape").addEventListener("click", () => {
        attempt("screen.orientation.lock(landscape)", () =>
          screen.orientation.lock("landscape"),
        );
      });

      document.querySelector("#fullscreen-lock").addEventListener("click", () => {
        attempt("requestFullscreen then lock(landscape)", async () => {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          }
          await screen.orientation.lock("landscape");
        });
      });

      document.querySelector("#unlock").addEventListener("click", () => {
        try {
          screen.orientation.unlock();
          write("screen.orientation.unlock: called", state());
        } catch (error) {
          write("screen.orientation.unlock: threw", {
            name: error?.name ?? "Error",
            message: error?.message ?? String(error),
          });
        }
      });

      document.querySelector("#exit-fullscreen").addEventListener("click", () => {
        attempt("exitFullscreen", () => document.exitFullscreen());
      });

      document.querySelector("#clear-log").addEventListener("click", () => {
        log.textContent = "";
        write("log cleared", state());
      });

      for (const eventName of ["resize", "orientationchange", "fullscreenchange"]) {
        window.addEventListener(eventName, () => write(`event: ${eventName}`, state()));
      }
      screen.orientation?.addEventListener("change", () =>
        write("event: screen.orientation.change", state()),
      );
      window.visualViewport?.addEventListener("resize", () =>
        write("event: visualViewport.resize", state()),
      );

      write("page loaded", state());
    </script>
  </body>
</html>
